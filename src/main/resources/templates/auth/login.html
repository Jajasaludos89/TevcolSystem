<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>Login - Tevcol</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://code.jquery.com/jquery-3.7.1.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.5/jquery.validate.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.5/additional-methods.min.js"></script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <style>
    .error{
      color:#dc2626;
      font-weight:600;
      margin-top:6px;
      font-size:.9rem;
    }
    .form-control.error{
      border:1px solid #dc2626;
    }
  </style>
</head>

<body class="bg-light">

<div class="container vh-100 d-flex align-items-center justify-content-center">
  <div class="card p-4 shadow-sm" style="width:380px;border-radius:18px;">

    <h4 class="mb-1">Tevcol</h4>
    <div class="text-secondary mb-3">Iniciar sesión</div>

    <div th:if="${param.error}" class="alert alert-danger">
      Usuario o contraseña incorrectos
    </div>

    <div th:if="${param.logout}" class="alert alert-success">
      Sesión cerrada correctamente
    </div>

    <form id="formLogin" method="post" action="/login" novalidate>

      <div class="mb-3">
        <label class="form-label">Usuario</label>
        <input class="form-control"
               name="username"
               id="username">
      </div>

      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input class="form-control"
               type="password"
               name="password"
               id="password">
      </div>

      <button class="btn btn-primary w-100" type="submit">
        Entrar
      </button>

    </form>

  </div>
</div>

<script>
$(document).ready(function(){

  // Validar usuario exacto
  $.validator.addMethod("usuarioCorrecto", function(value, element){
      return value === "adminutc,javier";
  }, "Usuario incorrecto");

  // Validar contraseña exacta
  $.validator.addMethod("passwordCorrecto", function(value, element){
      return value === "tatsumaki89*";
  }, "Contraseña incorrecta");

  $("#formLogin").validate({
      rules:{
          username:{
              required:true,
              usuarioCorrecto:true
          },
          password:{
              required:true,
              passwordCorrecto:true
          }
      },
      messages:{
          username:{
              required:"El usuario es obligatorio"
          },
          password:{
              required:"La contraseña es obligatoria"
          }
      },
      errorClass:"error",
      errorElement:"div",
      errorPlacement:function(error, element){
          error.insertAfter(element);
      },
      submitHandler:function(form){
          form.submit();
      }
  });

});
</script>

</body>
</html>
