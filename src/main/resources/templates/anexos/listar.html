<!-- templates/anexos/listar.html -->
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Anexos</title>

  <script src="https://code.jquery.com/jquery-3.7.1.js" crossorigin="anonymous"></script>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" crossorigin="anonymous" />

  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />
  <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.dataTables.min.css" />

  <style>
    body { background: #f3f4f6; }

    .sidebar{
      position: fixed; top:0; left:0; height:100vh; width:280px;
      background: linear-gradient(180deg, #0f172a, #020617);
      color:#e5e7eb; padding:20px 16px;
    }
    .sidebar .brand{ font-weight:700; letter-spacing:.3px; }
    .sidebar a{
      display:flex; align-items:center; gap:10px;
      color:#cbd5f5; text-decoration:none;
      padding:10px 14px; border-radius:10px;
      transition:all .2s ease; font-size:.95rem;
    }
    .sidebar a:hover{ background:rgba(255,255,255,.08); color:#fff; }
    .sidebar a.active{ background:rgba(59,130,246,.2); color:#fff; }

    .main-content{ margin-left:280px; padding:24px; }

    .card{
      border:1px solid #e5e7eb;
      border-radius:14px;
      box-shadow:0 8px 20px rgba(0,0,0,.06);
    }

    .table thead th{
      background:#111827; color:#f9fafb; border:none; font-size:.9rem;
      white-space: nowrap;
    }
    .table tbody td{
      vertical-align:middle; font-size:.9rem;
      white-space: nowrap;
    }
    .table-striped > tbody > tr:nth-of-type(odd){ background-color:#f9fafb; }

    .btn-primary{ border-radius:10px; font-weight:600; }

    .btn-warning, .btn-danger{
      border-radius:8px; width:38px; height:38px;
      display:inline-flex; align-items:center; justify-content:center;
      padding:0;
    }

    .dataTables_wrapper .dataTables_filter input,
    .dataTables_wrapper .dataTables_length select{
      border-radius:8px; border:1px solid #d1d5db;
      padding:6px 10px; outline:none;
    }

    .dt-buttons .dt-button{
      border-radius:8px !important;
      border:1px solid #d1d5db !important;
      background:#fff !important;
      padding:6px 12px !important;
      font-weight:600;
    }
    .dt-buttons .dt-button:hover{ background:#f3f4f6 !important; }
  </style>
</head>

<body>

  <aside class="sidebar">
    <div class="d-flex align-items-center gap-2 mb-4">
      <div class="rounded-circle bg-light" style="width:42px;height:42px;"></div>
      <div>
        <div class="brand">Tevcol</div>
        <small style="color:#94a3b8;">Módulo Declaraciones</small>
      </div>
    </div>

    <nav class="d-grid gap-1">
      <a href="/" class="">
        <i class="fa-solid fa-house"></i> Inicio
      </a>

      <a href="/declaraciones" class="">
        <i class="fa-solid fa-file-lines"></i> Declaraciones
      </a>

      <a href="/anexos" class="active">
        <i class="fa-solid fa-paperclip"></i> Anexos
      </a>
    </nav>

    <hr style="border-color:rgba(255,255,255,.12);" class="my-4">

    <div class="small" style="color:#94a3b8;">
      Tevcol
    </div>
  </aside>

  <main class="main-content">
    <div class="container-fluid">

      <div class="d-flex align-items-center justify-content-between mb-3">
        <div>
          <h3 class="mb-0">Lista de Anexos</h3>
          <small class="text-secondary">CRUD</small>
        </div>

        <a class="btn btn-primary" href="/anexos/nuevo">
          <i class="fa-solid fa-plus me-2"></i>Nuevo Anexo
        </a>
      </div>

      <div class="card p-3">
        <div class="table-responsive">
          <table id="tablaAnexos" class="table table-striped table-hover align-middle w-100">
            <thead class="table-dark">
              <tr>
                <th>Código</th>

                <th>Fecha Anexo</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Archivo</th>

                <th>Declaración (FK)</th>

                <th>Fecha Creado</th>
                <th>Fecha Editado</th>

                <th style="width: 160px;">Acciones</th>
              </tr>
            </thead>

            <tbody>
              <tr th:each="a : ${anexos}">
                <td th:text="${a.codigoAnxDeclaracion}"></td>

                <td th:text="${a.fechaAnxDeclaracion}"></td>
                <td th:text="${a.nombreAnxDeclaracion}"></td>
                <td th:text="${a.descripcionAnxDeclaracion}"></td>

                <td>
                  <span th:if="${a.linkArchivoAnxDeclaracion == null || #strings.isEmpty(a.linkArchivoAnxDeclaracion)}"
                        class="badge text-bg-secondary">Sin archivo</span>

                  <a th:if="${a.linkArchivoAnxDeclaracion != null && !#strings.isEmpty(a.linkArchivoAnxDeclaracion)}"
                     class="badge text-bg-primary text-decoration-none"
                     th:text="${a.linkArchivoAnxDeclaracion}"
                     href="#"
                     title="Link/Nombre del archivo"></a>
                </td>

                <!-- SOLO con la relación ManyToOne (recomendado) -->
                <td th:text="${a.declaracion != null ? a.declaracion.codigoDeclaracion : ''}"></td>

                <td th:text="${a.fechaCreadoAnxDeclaracion}"></td>
                <td th:text="${a.fechaEditadoAnxDeclaracion}"></td>

                <td>
                  <div class="d-flex gap-2">
                    <a class="btn btn-sm btn-warning"
                       th:href="@{/anexos/editar/{id}(id=${a.codigoAnxDeclaracion})}">
                      <i class="fa-solid fa-pen-to-square"></i>
                    </a>

                    <button type="button"
                            class="btn btn-sm btn-danger btnEliminar"
                            th:attr="data-url=@{/anexos/eliminar/{id}(id=${a.codigoAnxDeclaracion})}">
                      <i class="fa-solid fa-trash"></i>
                    </button>
                  </div>
                </td>
              </tr>
            </tbody>

          </table>
        </div>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>

  <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.print.min.js"></script>

  <script>
    $(document).ready(function () {

      $("#tablaAnexos").DataTable({
        pageLength: 8,
        dom: "Bfrtip",
        buttons: [
          { extend: "excelHtml5", title: "Anexos" },
          { extend: "pdfHtml5", title: "Anexos" },
          { extend: "print", title: "Anexos" }
        ],
        language: {
          url: "https://cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json"
        }
      });

      $(document).on("click", ".btnEliminar", function () {
        const url = $(this).data("url");

        Swal.fire({
          title: "¿Eliminar anexo?",
          text: "Esta acción no se puede deshacer",
          icon: "warning",
          showCancelButton: true,
          confirmButtonText: "Sí, eliminar",
          cancelButtonText: "Cancelar"
        }).then((r) => {
          if (r.isConfirmed) window.location.href = url;
        });
      });

    });
  </script>

  <script th:if="${alertType}">
    Swal.fire({
      icon: '[[${alertType}]]',
      title: '[[${alertTitle}]]',
      text: '[[${alertText}]]',
      confirmButtonText: 'OK'
    });
  </script>

</body>
</html>
